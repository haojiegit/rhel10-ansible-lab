---
- name: Install slurm build dependencies
  hosts: all
  become: true
  tasks:
    - name: The following packages are required to build RPM packages from source tarball
      ansible.builtin.dnf:
        name: 
          - autoconf 
          - automake
          - gcc 
          - make
          - mariadb-devel 
          - munge-devel
          - pam-devel
          - perl-ExtUtils-MakeMaker 
          - perl-devel 
          - readline-devel
        state: present
    
    - name: The following packages are required for cgroupv2
      ansible.builtin.dnf:
        name:
          - kernel-headers
          - dbus-devel
          - libbpf
          - libbpf-devel
        state: present

    - name: Following packges are required for topology
      ansible.builtin.dnf:
        name:
          - hwloc
          - hwloc-devel
        state: present

- name: Download source tarball from the slurm official website
  hosts: control
  tasks:
    - name: Download slurm source tarball
      ansible.builtin.get_url:
        url: "https://github.com/SchedMD/slurm/releases/download/slurm-26-05-5-1/slurm-26.05.5.tar.bz2"
        dest: "/home/ansible/slurm/"
        mode: '0644'
        checksum: "sha256:4680cafc82b0689865c885eb703441e7ebf764896c40fd03a50f2fcb60664f68"
      register: downloaded_file

    - name: Check if the compiled RPM already exists
      ansible.builtin.stat:
        path: "/home/ansible/rpmbuild/RPMS/x86_64/slurm-26.05.5-1.el10.x86_64.rpm"
      register: rpm_file

    - name: Build the RPM using rpmbuild
      ansible.builtin.command:
        cmd: "rpmbuild -ta --with cgroupv2 /home/ansible/slurm/slurm-26.05.5.tar.bz2"
      when: downloaded_file.changed or not rpm_file.stat.exists

- name: Distribute RPMs to all nodes (for control node, it's equivalent to copying them to /tmp)
  hosts: all
  become: true
  tasks:
    - name: Copy RPMs from control node to target nodes
      ansible.builtin.copy:
        src: "{{item}}"
        dest: "/tmp/"
        mode: '0644'
      with_fileglob:
        - "/home/ansible/rpmbuild/RPMS/x86_64/*.rpm"

- name: Install Slurm packages on Controller and Managed Nodes
  hosts: control, slurm
  become: true
  
  vars:
    # Common packages needed on ALL nodes
    slurm_common_packages:
      - "/tmp/slurm-26.05.5-1.el10.x86_64.rpm"
      - "/tmp/slurm-slurmd-26.05.5-1.el10.x86_64.rpm"
    
    # Controller-specific packages
    slurm_controller_packages:
      - "/tmp/slurm-slurmctld-26.05.5-1.el10.x86_64.rpm"
      - "/tmp/slurm-26.05.5-1.el10.x86_64.rpm"

  tasks:
    - name: Install base Slurm packages on all nodes
      ansible.builtin.dnf:
        name: "{{ slurm_common_packages }}"
        state: present
        disable_gpg_check: true
      when: inventory_hostname in groups['slurm']

    - name: Install Slurm controller package on controller nodes only
      ansible.builtin.dnf:
        name: "{{ slurm_controller_packages }}"
        state: present
        disable_gpg_check: true
      when: inventory_hostname in groups['control_node']

- name: Configure Slurm system user and directories
  hosts: all
  become: true
  
  tasks:
    - name: Create the slurm system user
      ansible.builtin.user:
        name: slurm
        system: true
        create_home: true
        home: "/var/lib/slurm"
        shell: "/sbin/nologin"
        comment: "Slurm workload manager"

    - name: Ensure correct permissions on the slurm home directory
      ansible.builtin.file:
        path: "/var/lib/slurm"
        state: directory
        owner: "slurm"
        group: "slurm"
        mode: '0750'

- name: Configure Slurm directories on controller and managed nodes
  hosts: control, slurm
  become: true
  
  tasks:
    - name: Create and configure Slurm directories on the controller node
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: "slurm"
        group: "slurm"
        mode: '0755'
      loop:
        - "/var/log/slurm"
        - "/var/spool/slurmctld"
      when: inventory_hostname in groups['control_node']

    - name: Create and configure Slurm directories on the managed nodes
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: "root"
        group: "root"
        mode: '0755'
      loop:
        - "/var/log/slurm"
        - "/var/spool/slurmd"
      when: inventory_hostname in groups['slurm']

- name: Configure and distribute slurm.conf across all nodes
  hosts: control, slurm
  become: true
  
  tasks:
    - name: Ensure /etc/slurm configuration directory exists
      ansible.builtin.file:
        path: "/etc/slurm"
        state: directory
        owner: "root"
        group: "root"
        mode: '0755'

    - name: Create and distribute cgroup.conf
      ansible.builtin.copy:
        dest: "/etc/slurm/cgroup.conf"
        owner: "root"
        group: "root"
        mode: '0644'
        content: |
          CgroupPlugin=autodetect
          ConstrainCores=yes
          ConstrainRAMSpace=yes
          ConstrainSwapSpace=no

    - name: Create and distribute slurm.conf
      ansible.builtin.copy:
        dest: "/etc/slurm/slurm.conf"
        owner: "root"
        group: "root"
        mode: '0644'
        content: |
          ClusterName=hpc_lab

          SlurmctldHost=control.lab.local
          SrunPortRange=60001-61000
          SlurmUser=slurm
          #ReturnToService=1
          #SlurmdUser=root
          AuthType=auth/munge
          CryptoType=crypto/munge

          SlurmctldPort=6817
          SlurmdPort=6818

          SlurmctldTimeout=300
          SlurmdTimeout=300

          SlurmctldLogFile=/var/log/slurm/slurmctld.log
          SlurmdLogFile=/var/log/slurm/slurmd.log

          StateSaveLocation=/var/spool/slurmctld
          ###SlurmdSpoolDir=/var/spool/slurmd

          SwitchType=switch/none
          MpiDefault=none

          ProctrackType=proctrack/cgroup
          TaskPlugin=task/cgroup

          SelectType=select/cons_tres
          SelectTypeParameters=CR_Core_Memory

          SchedulerType=sched/backfill

          AccountingStorageType=accounting_storage/none
          JobAcctGatherType=jobacct_gather/cgroup

          NodeName=node1 CPUs=2 RealMemory=1704 State=UNKNOWN
          NodeName=node2 CPUs=2 RealMemory=1704 State=UNKNOWN

          PartitionName=compute Nodes=node1,node2 Default=YES MaxTime=INFINITE State=UP
      when: inventory_hostname in groups['control_node']
      notify: Restart slurmctld service
    
    - name: Create and distribute slurm.conf
      ansible.builtin.copy:
        dest: "/etc/slurm/slurm.conf"
        owner: "root"
        group: "root"
        mode: '0644'
        content: |
          ClusterName=hpc_lab

          SlurmctldHost=control.lab.local

          SlurmUser=slurm
          #ReturnToService=1
          #SlurmdUser=root
          AuthType=auth/munge
          CryptoType=crypto/munge

          SlurmctldPort=6817
          SlurmdPort=6818

          SlurmctldTimeout=300
          SlurmdTimeout=300

          SlurmctldLogFile=/var/log/slurm/slurmctld.log
          SlurmdLogFile=/var/log/slurm/slurmd.log

          ##StateSaveLocation=/var/spool/slurmctld
          SlurmdSpoolDir=/var/spool/slurmd

          SwitchType=switch/none
          MpiDefault=none

          ProctrackType=proctrack/cgroup
          TaskPlugin=task/cgroup

          SelectType=select/cons_tres
          SelectTypeParameters=CR_Core_Memory

          SchedulerType=sched/backfill

          AccountingStorageType=accounting_storage/none
          JobAcctGatherType=jobacct_gather/cgroup

          NodeName=node1 CPUs=2 RealMemory=1704 State=UNKNOWN
          NodeName=node2 CPUs=2 RealMemory=1704 State=UNKNOWN

          PartitionName=compute Nodes=node1,node2 Default=YES MaxTime=INFINITE State=UP
      when: inventory_hostname in groups['slurm']
      notify: Restart slurmd service
    
  handlers:
    - name: Restart slurmctld service
      ansible.builtin.service:
        name: slurmctld
        state: restarted
          
    - name: Restart slurmd service
      ansible.builtin.service:
        name: slurmd
        state: restarted

- name: Enable slurmd on compute nodes and slurmctld on the control node
  hosts: control, slurm
  tasks:
    - name: Enable slurmd on compute nodes
      ansible.builtin.service:
        name: slurmd
        state: started
        enabled: yes
      when: inventory_hostname in groups['slurm']

    - name: Enable slurmctld on control node
      ansible.builtin.service:
        name: slurmctld
        state: started
        enabled: yes
      when: inventory_hostname in groups['control_node']

- name: Allow slurm traffic through firewall
  hosts: control, slurm
  tasks:
    - name: Permit traffic in default zone on port 6817/tcp
      ansible.posix.firewalld:
        port: 6817/tcp 
        permanent: true
        immediate: true
        state: enabled
      when: inventory_hostname in groups['control_node']

    - name: Permit traffic in default zone on port 60001-61000/tcp
      ansible.posix.firewalld:
        port: 60001-61000/tcp 
        permanent: true
        immediate: true
        state: enabled
      when: inventory_hostname in groups['control_node']

    - name: Permit traffic in default zone on port 6818/tcp
      ansible.posix.firewalld:
        port: 6818/tcp
        permanent: true
        immediate: true
        state: enabled
      when: inventory_hostname in groups['slurm']
