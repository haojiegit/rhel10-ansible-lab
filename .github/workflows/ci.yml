name: Ansible CI

# 1. TRIGGERS: When should this workflow run?
on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

# 2. JOBS: What work needs to be performed?
jobs:
  lint-and-validate:
    runs-on: ubuntu-latest # <--- The ephemeral runner environment

    steps:
      # 3. CHECKOUT: Pulls your repository code into the GitHub runner
      - name: Checkout Repository
        uses: actions/checkout@v6

      # 4. ENVIRONMENT: Installs Python so we can run Ansible CLI tools
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.10'

      # 5. DEPENDENCIES: Installs ansible-core and ansible-lint in the cloud runner
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ansible-core ansible-lint
          ansible-galaxy collection install ansible.posix

      # 6. STATIC CHECK: Does the YAML parse correctly and do variables align?
      - name: Run Ansible Syntax Check
        run: |
          ansible-playbook site.yml --syntax-check
          ansible-playbook setup_repo.yml --syntax-check

      # 7. LINTING: Does the code follow enterprise best practices and formatting standards?
      - name: Run Ansible Lint
        run: |
          ansible-lint
